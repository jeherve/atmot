<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>AT Mot — a daily word game on atproto</title>
    <meta
      name="description"
      content="A bilingual (English / French) daily 5-letter word game native to the AT Protocol. Your results live in your own PDS; the leaderboard is powered by the Constellation backlink index. No database."
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f7f8fa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e1116" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link
      rel="preload"
      href="/fonts/OverusedGrotesk-VF.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!-- Open Graph / share preview -->
    <meta property="og:title" content="AT Mot — a daily word game on atproto" />
    <meta
      property="og:description"
      content="Guess the daily 5-letter word in English or French. Built on the AT Protocol — your data is yours."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://atmot.herve.bzh" />
  </head>
  <body>
    <noscript>AT Mot needs JavaScript to run. It's a static client-side app — no tracking, no server-side game logic.</noscript>
    <div id="app" aria-busy="true"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
